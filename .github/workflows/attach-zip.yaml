name: Attach NotoSerifMono.zip to a release

# Adds (or replaces) the fixed-name NotoSerifMono.zip on an existing release, built from the
# fonts committed at that tag. Releases made by build.yaml already have it; this is for
# releases tagged before the asset had a fixed name (v2.502).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2.502
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Build and upload NotoSerifMono.zip
        run: |
          cd fonts && zip -r ../NotoSerifMono.zip ttf webfonts && cd ..
          zip -j NotoSerifMono.zip OFL.txt README.md
          unzip -l NotoSerifMono.zip
          gh release upload "$TAG" NotoSerifMono.zip --clobber
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
